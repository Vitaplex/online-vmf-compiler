<!DOCTYPE html>
<html>

<head>
    <title>Online .vmf Compiler</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="/static/favicon.ico">
    <script type="module" src="/static/js/main.js"></script>
    <script type="module" src="/static/components/UserCustomFiles.js"></script>
</head>

<body>
    <header>
        <img id="logo" src="/static/media/logo.png">
        <h1>Online .vmf Compiler</h1>
        <div id="header-content-right">
            <a class="header-link" href="/stats.html">Statistics</a>
            <code id="cluster-node" title="Cluster node for this compile job" style="display: none"></code>
            <code id="label-running-jobs" title="Current running jobs">0</code>
            <input id="input-ticket" type="text" placeholder="Job ID" aria-label="Job ID">
            <button class="slim" id="button-input-ticket">Get compile job</button>
            <details id="users-previous-jobs">
                <summary aria-label="Previous jobs">Previous jobs</summary>
                <div class="job-history-list"></div>
            </details>
        </div>
    </header>
    <main>
        <fieldset class="main-section" id="section-left">
            <legend>Custom assets</legend>
        </fieldset>
        <fieldset class="main-section" id="section-right">
            <legend>Map and compile setup</legend>
            <section id="section-right-top" class="flex fd-tb">
                <div class="flex fd-lr">
                    <select id="select-game-vmf">
                        <!-- Populated via JS -->
                    </select>
                    <label id="label-input-vmf" for="input-vmf">Select .vmf file</label>
                    <input hidden id="input-vmf" type="file" accept=".vmf">
                    <button class="inactive" id="button-compile-vmf"><img src="/static/media/go.png"><span>Compile
                            map</span></button>
                    <div class="flex fd-tb">
                        <label for="ignore-missing-files" title="Ignore files not found locally or uploaded by the user">
                            <input type="checkbox" id="ignore-missing-files">
                            <img height="20" src="/static/media/ignore_custom.png" alt="Ignore missing files">
                        </label>
                        <label for="ignore-visclusters" title="Only useful if using vvis++! Removes func_visclusters from the .vmf before uploading to server. Does not modify your local version.">
                            <input type="checkbox" id="ignore-visclusters">
                            <img height="20" src="/static/media/ignore_viscluster.png" alt="Ignore visclusters">
                        </label>
                    </div>
                    <button class="inactive" id="download-button"><a style="color:unset; text-decoration: none"
                            href="r">Download</a></button>
                </div>
                <div class="flex fd-tb fw-nw max">
                    <div class="flex fd-lr compile-parameters">
                        <input list="vbsp" class="compile-parameter" id="input-vbsp-params" type="text"
                            placeholder="VBSP parameters" /></label>
                        <datalist id="vbsp">
                            <option value="-allowdynamicpropsasstatic">
                            <option value="-staticpropcombine">
                        </datalist>
                    </div>
                    <div class="flex fd-lr compile-parameters">
                        <input list="vvis" class="compile-parameter" id="input-vvis-params" type="text"
                            placeholder="VVIS parameters">
                        <datalist id="vvis">
                            <option value="-threads 8">
                        </datalist>
                    </div>
                    <div class="flex fd-lr compile-parameters">
                        <input list="vrad" class="compile-parameter" id="input-vrad-params" type="text"
                            placeholder="VRAD parameters">
                        <datalist id="vrad">
                            <option value="-threads 8">
                        </datalist>

                    </div>
                </div>
                <div class="flex fd-lr fw-nw">
                    <div id="progress-bar" class="inactive">
                        <div id="progress-vbsp" class="progress-item">
                            <span>VBSP</span>
                            <small class="progress-date" hidden></small>
                        </div>
                        <div id="progress-vvis" class="progress-item">
                            <span>VVIS</span>
                            <small class="progress-date" hidden></small>
                        </div>
                        <div id="progress-vrad" class="progress-item">
                            <span>VRAD</span>
                            <small class="progress-date" hidden></small>
                        </div>
                        <div id="progress-finished" class="progress-item">
                            <span>Finished!</span>
                            <small class="progress-date" hidden></small>
                        </div>
                    </div>
                    <button id="button-cancel-compile" class="inactive slim">Cancel</button>
                </div>
                <div class="labeled flex fd-lr max">
                    <span>Application Output</span>
                    <textarea class="pre" id="response-output" placeholder="Any errors will appear here..."></textarea>
                </div>
            </section>
            <section id="section-right-bottom">
                <div class="labeled flex fd-lr max">
                    <span>Compiler window</span>
                    <textarea class="pre" id="compiler-output" placeholder="VBSP/VVID/VRAD output goes here"></textarea>
                </div>
            </section>
        </fieldset>
    </main>
</body>

</html>
