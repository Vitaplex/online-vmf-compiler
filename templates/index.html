<!DOCTYPE html>
<html>

<head>
    <title>Online .vmf Compiler</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='components/UserCustomFiles.js') }}"></script>
</head>

<body>
    <header>
        <img id="logo" src="{{ url_for('static', filename='media/logo.png') }}">
        <h1>Online .vmf Compiler</h1>
        <div id="header-content-right">
            <input id="input-ticket" type="text" placeholder="Ticket ID">
            <button class="slim" id="button-input-ticket">Get compile job</button>
        </div>
    </header>
    <main>
        <fieldset class="main-section" id="section-left">
            <legend>Custom assets</legend>
        </fieldset>
        <fieldset class="main-section" id="section-right">
            <legend>Map and compile setup</legend>
            <section id="section-right-top" class="flex fd-tb">
                <div class="flex fd-lr">
                    <select id="select-game-vmf">
                        <!-- Populated via JS -->
                    </select>
                    <label id="label-input-vmf" for="input-vmf">Select .vmf file</label>
                    <input hidden id="input-vmf" type="file" accept=".vmf">
                    <button class="inactive" id="button-compile-vmf"><img src="{{ url_for('static', filename='media/go.png') }}"><span>Compile map</span></button>
                    <input type="checkbox" id="ignore-missing-files">
                    <label for="ignore-missing-files">Ignore missing files</label>
                </div>
                <div class="labeled flex fd-lr max">
                    <span>Response Output</span>
                    <textarea class="pre" id="response-output"
                        placeholder="Any .vmf errors will appear here..."></textarea>
                </div>
            </section>
            <section id="section-right-bottom">
                <div class="labeled flex fd-lr max">
                    <span>Compiler output</span>
                    <textarea class="pre" id="compiler-output" placeholder="VBSP/VVID/VRAD output goes here"></textarea>
                </div>
            </section>
        </fieldset>
    </main>
    <footer>
        <a href="https://guttespinat.no"></a>
    </footer>
</body>

</html>
