<!DOCTYPE html>
<html>

<head>
    <title>Online .vmf Compiler</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="/static/favicon.ico">
    <script type="module" src="/static/js/main.js"></script>
    <script type="module" src="/static/components/UserCustomFiles.js"></script>
</head>

<body>
    <header>
        <img id="logo" src="/static/media/logo.png">
        <h1>Online .vmf Compiler</h1>
        <div id="header-content-right">
            <code id="label-running-jobs" title="Current running jobs">0</code>
            <input id="input-ticket" type="text" placeholder="Ticket ID">
            <button class="slim" id="button-input-ticket">Get compile job</button>
        </div>
        <select id="users-previous-jobs">
            <option value="" disabled selected>Previous jobs</option>
        </select>
    </header>
    <main>
        <fieldset class="main-section" id="section-left">
            <legend>Custom assets</legend>
        </fieldset>
        <fieldset class="main-section" id="section-right">
            <legend>Map and compile setup</legend>
            <section id="section-right-top" class="flex fd-tb">
                <div class="flex fd-lr">
                    <select id="select-game-vmf">
                        <!-- Populated via JS -->
                    </select>
                    <label id="label-input-vmf" for="input-vmf">Select .vmf file</label>
                    <input hidden id="input-vmf" type="file" accept=".vmf">
                    <button class="inactive" id="button-compile-vmf"><img src="/static/media/go.png"><span>Compile map</span></button>
                    <input type="checkbox" id="ignore-missing-files">
                    <label for="ignore-missing-files">Ignore missing files</label>
                    <button class="inactive" id="download-button">Download</button>
                </div>
                <div class="flex fd-tb fw-nw max">
                    <div class="flex fd-lr compile-parameters">
                        <button>*</button>
                        <div class="compile-parameters-list" style="display: none;">
                            <pre>-staticpropcombine</pre>
                        </div>
                        <input class="compile-parameter" id="input-vbsp-params" type="text" placeholder="VBSP parameters">
                    </div>
                    <div class="flex fd-lr compile-parameters">
                        <button>*</button>
                        <div class="compile-parameters-list" style="display: none;">
                            <pre>-threads 8</pre>
                        </div>
                        <input class="compile-parameter" id="input-vvis-params" type="text" placeholder="VVIS parameters">
                    </div>
                    <div class="flex fd-lr compile-parameters">
                        <button>*</button>
                        <div class="compile-parameters-list" style="display: none;">
                            <pre>-threads 8</pre>
                        </div>
                        <input class="compile-parameter" id="input-vrad-params" type="text" placeholder="VRAD parameters">
                    </div>
                </div>
                <div class="flex fd-lr fw-nw">
                    <div id="progress-bar" class="inactive">
                        <div id="progress-vbsp" class="progress-item">
                            <span>VBSP</span>
                        </div>
                        <div id="progress-vvis" class="progress-item">
                            <span>VVIS</span>
                        </div>
                        <div id="progress-vrad" class="progress-item">
                            <span>VRAD</span>
                        </div>
                        <div id="progress-finished" class="progress-item">
                            <span>Finished!</span>
                        </div>
                    </div>
                    <button id="button-cancel-compile" class="inactive slim">Cancel</button>
                </div>
                <div class="labeled flex fd-lr max">
                    <span>Application Output</span>
                    <textarea class="pre" id="response-output" placeholder="Any errors will appear here..."></textarea>
                </div>
            </section>
            <section id="section-right-bottom">
                <div class="labeled flex fd-lr max">
                    <span>Compiler window</span>
                    <textarea class="pre" id="compiler-output" placeholder="VBSP/VVID/VRAD output goes here"></textarea>
                </div>
            </section>
        </fieldset>
    </main>
</body>
</html>
